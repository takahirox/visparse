[project]
name = "visparse"
version = "0.1.0"
description = "Deterministic, evidence-first visual analysis records"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Visparse contributors" }]
dependencies = []

[project.optional-dependencies]
collector = ["playwright>=1.49,<2"]

[project.scripts]
visparse = "visparse.cli:main"
visparse-collector = "visparse_collector.cli:main"

[tool.setuptools.package-data]
visparse_collector = ["inventory.js"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
