[project]
name = "visparse"
version = "0.1.0"
description = "Deterministic, evidence-first visual analysis records"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Visparse contributors" }]
dependencies = []

[project.scripts]
visparse = "visparse.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
